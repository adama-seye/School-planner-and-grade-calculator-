<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

  <!-- HOME -->
  <section id="home">
    <h1>School Planner</h1>
    <p>Organize your grades and your school life.</p>

    <div class="home-buttons">
      <button id="go-calculator">📊 Grade Calculator</button>
      <button id="go-planner">📅 Planner</button>
    </div>
  </section>

  <!-- GRADE CALCULATOR -->
  <section id="calculator" class="hidden">
    <button class="back-btn">← Back</button>
    <h2>Grade Calculator</h2>

    <div id="subjects"></div>

    <div class="calc-actions">
      <button id="add-subject">➕ Add subject</button>
      <button id="calculate">Calculate Weighted Average</button>
    </div>

    <p id="result"></p>
  </section>

  <!-- PLANNER -->
  <section id="planner" class="hidden">
    <button class="back-btn">← Back</button>
    <h2>Planner</h2>

    <div class="planner-controls">
      <button id="prev-month">←</button>
      <span id="month-title"></span>
      <button id="next-month">→</button>
    </div>

    <div id="calendar"></div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
