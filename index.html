<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School Planner & Grade Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <div class="logo">🦋</div>

    <h1 id="current-term-title">Term 1</h1>
    <p>This app helps students track exams and calculate weighted averages.</p>

    <h2>Settings</h2>

    <label>
      Term type
      <select id="term-type">
        <option value="trimester">Trimester</option>
        <option value="semester">Semester</option>
      </select>
    </label>

    <br><br>

    <label>
      Grade scale
      <select id="scale">
        <option value="20">/20</option>
        <option value="100">/100</option>
      </select>
    </label>

    <div class="term-controls">
      <button id="prev-term">Previous term</button>
      <button id="next-term">Next term</button>
    </div>

    <h2>Subjects</h2>

    <div id="subjects"></div>

    <button id="add-subject">+ Add subject</button>
    <button id="calculate">Calculate</button>

    <p id="result"></p>

  </div>

  <script src="script.js"></script>
</body>
</html>
