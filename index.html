<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School Planner & Grade Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>  
  <div class="container">

  <h1>School Planner & Grade Calculator</h1>
  <p>This app helps students track exams and calculate weighted averages.</p>

  <h2>Academic System</h2>
  <select id="term-type">
    <option value="semester">Semester (2 terms)</option>
    <option value="trimester">Trimester (3 terms)</option>
  </select>

  <h2 id="current-term-title">Term 1</h2> 

    <button id="prev-btn">Previous Term</button>
    <button id="next-btn">Next Term</button>                            

</div>

<!-- GRADE CALCULATOR SCREEN -->
<div id="calculator-screen" class="hidden">
  <button class="back">← Back</button>

  <h2>Grade Calculator</h2>

  <!-- everything you ALREADY BUILT for grades stays here -->
  <!-- academic system, scale, subjects, calculate button, result -->
</div>

<!-- PLANNER SCREEN -->
<div id="planner-screen" class="hidden">
  <button class="back">← Back</button>

  <h2>Planner</h2>
  <p>Track exams, homework, and revisions.</p>

  <!-- planner content will go here next -->
</div>

  </div>

  <script src="script.js"></script>

  <script>
let currentTerm = 1;
let maxTerms = 2;

const termType = document.getElementById("term-type");
const title = document.getElementById("current-term-title");

termType.addEventListener("change", () => {
  maxTerms = termType.value === "semester" ? 2 : 3;
  currentTerm = 1;
  title.innerText = "Term " + currentTerm;
});

document.getElementById("next-btn").addEventListener("click", () => {
  if (currentTerm < maxTerms) {
    currentTerm++;
    title.innerText = "Term " + currentTerm;
  }
});

document.getElementById("prev-btn").addEventListener("click", () => {
  if (currentTerm > 1) {
    currentTerm--;
    title.innerText = "Term " + currentTerm;
  }
});
</script>

</body>

</html>
