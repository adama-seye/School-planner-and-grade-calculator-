<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School Planner & Grade Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>  
<div class="container">

  <!-- HOME -->
  <section id="home">
    <h1>School Planner</h1>
    <p>Choose what you want to work on</p>

    <button id="go-calculator" class="main-btn">
     📊 Grade Calculator
    </button>

    <button id="go-planner" class="main-btn">
     📆 Planner
    </button>
  </section>

  <!-- GRADE CALCULATOR -->
  <section id="calculator" class="hidden">
    <h2>Grade Calculator</h2>

    <button class="back-btn">← Back</button>

    <!-- your calculator content stays here -->
  </section>

  <!-- PLANNER -->
  <section id="planner" class="hidden">
    <h2>Planner</h2>

    <button class="back-btn">← Back</button>

    <p>Planner coming next</p>
  </section>

</div>

<!-- GRADE CALCULATOR SCREEN -->
<div id="calculator-screen" class="hidden">
  <button class="back">← Back</button>

  <h2>Grade Calculator</h2>

  <!-- everything you ALREADY BUILT for grades stays here -->
  <!-- academic system, scale, subjects, calculate button, result -->
</div>

<!-- PLANNER SCREEN -->
<div id="planner-screen" class="hidden">
  <button class="back">← Back</button>

  <h2>Planner</h2>
  <p>Track exams, homework, and revisions.</p>

  <!-- planner content will go here next -->
</div>

  </div>

  <script src="script.js"></script>

</body>
</html>
