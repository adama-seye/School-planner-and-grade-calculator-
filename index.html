<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School Planner & Grade Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <!-- HOME -->
    <section id="home">
      <h1>School Planner</h1>
      <p>Choose what you want to work on</p>

      <button id="go-calculator" class="main-btn">
        📊 Grade Calculator
      </button>

      <button id="go-planner" class="main-btn">
        📆 Planner
      </button>
    </section>

      <section id="calculator" class="hidden">
  <button class="back-btn">← Back</button>

  <h2>Grade Calculator</h2>

  <h3>Academic System</h3>
  <select id="term-type">
    <option value="semester">Semester</option>
    <option value="trimester">Trimester</option>
  </select>

  <h3>Grading Scale</h3>
  <select id="scale">
    <option value="20">Out of 20</option>
    <option value="50">Out of 50</option>
    <option value="100">Out of 100</option>
  </select>

  <div id="subjects"></div>

  <button id="add-subject">➕ Add subject</button>
  <button id="calculate">Calculate Weighted Average</button>

  <p id="result"></p>
</section>

   <section id="planner" class="hidden">
  <button class="back-btn">← Back</button>

  <h2>Planner</h2>
  <p>Track exams, homework, and revisions.</p>

  <p class="muted">Planner features coming next.</p>
</section>

  </div>

  <script src="script.js"></script>
</body>
  
</html>
